name: Pages

# Builds every deck under decks/ and publishes site/ on the gh-pages branch,
# which GitHub Pages serves. Pull-request previews (preview.yml) live under
# /pr-preview/ on the same branch; clean-exclude keeps a production deploy
# from removing them.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The build runs the project's npm packages, so it gets no write access.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          SEAL_SLIDES_REPO: ${{ github.repository }}
          SEAL_SLIDES_REF: ${{ github.ref_name }}
          SEAL_SLIDES_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: site
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        # the deploy action pushes gh-pages with the checkout token, so
        # credentials must persist for this job (unlike the build).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: site
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
