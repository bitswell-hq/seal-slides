name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - name: Unit tests (loader, GitHub persistence with a mocked API, build, recorder helpers)
        run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke test (navigation, edit mode, recorder with fake media devices)
        run: npm run test:smoke
