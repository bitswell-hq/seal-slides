<script type="application/json" id="deck-data">{"deck":{"slug":"example","dir":"decks/example","file":"decks/example/deck.md","raw":"---\ntitle: Seal Slides\ndescription: The example deck for the seal-slides engine. Markdown slides, two drawn slides, speaker notes written as a spoken script, sources, and a three-minute target.\nduration: 3:00\nstatuses:\n  now: works today\n  next: planned\nseals:\n  A: a17ed17af29ac70236f272c65ac2e071c77111cf7c4c085a05ec69412cef9a9b\n---\nThis is the example deck. Each slide is one Markdown file under `slides/`, in\nfile-name order. The two drawn slides live under `animations/`.\n"},"slides":[{"file":"decks/example/slides/01-title.md","raw":"---\ntitle: Seal Slides\nlayout: title\nkicker: Example deck\nlegend: true\ndraw: animations/dial.js\nalt: A seal at the centre of a dial with a tick for every slide. A document, a pencil and a microphone sit around the dial, linked to it.\nduration: 0:15\nnotes: |\n  This is Seal Slides, a deck engine.\n  You write slides in Markdown and draw the rest in SVG.\n  The page you are watching can edit itself, take comments, and record a take.\nsources:\n  - \"[README.md](https://github.com/bitswell-hq/seal-slides#readme), Authoring a deck\"\n---\nMarkdown slides, drawn slides, an editor that saves through GitHub, and a session recorder.\n"},{"file":"decks/example/slides/02-folder.md","raw":"---\ntitle: One folder per deck\nstatus: now\nduration: 0:20\nnotes: |\n  A deck is one folder.\n  deck.md holds the title, the target length and the status labels.\n  Every slide is its own Markdown file, read in file-name order.\n  Drawn slides are small JavaScript modules beside them.\n  The build turns the folder into static files, with no server.\nsources:\n  - \"README.md, Authoring a deck\"\n  - \"scripts/build.mjs\"\n---\n```text\ndecks/example/\n  deck.md              title, duration, status labels, seals\n  slides/\n    01-title.md        one Markdown file per slide\n    02-folder.md\n    04-drawn.md        draw: animations/pipeline.js\n  animations/\n    pipeline.js        a drawn slide\n  comments/            comments kept as files\n```\n\n`npm run build` writes `site/`, ready for GitHub Pages.\n"},{"file":"decks/example/slides/03-markdown.md","raw":"---\ntitle: A slide is a Markdown file\nstatus: now\nduration: 0:22\nnotes: |\n  The front matter carries everything that is not on the slide.\n  The title, a status, and a target length.\n  The notes are the script you read aloud, one short line at a time.\n  Sources are listed apart, in their own view.\n  The body below the front matter is ordinary Markdown.\nsources:\n  - \"README.md, The Markdown slide format\"\n  - \"engine/loader.js\"\n---\n\u003cdiv class=\"cols\">\n\n```yaml\n---\ntitle: A slide is a Markdown file\nstatus: now\nduration: 0:22\nnotes: |\n  One line per line read aloud.\nsources:\n  - \"README.md\"\n---\n```\n\n- **title** heads the slide\n- **status** picks its marks\n- **notes** is the spoken script\n- **sources** go to the sources view\n- **duration** paces the recording\n\n\u003c/div>\n"},{"file":"decks/example/slides/04-drawn.md","raw":"---\ntitle: Some slides are drawn\nstatus: now\ndraw: animations/pipeline.js\nalt: A Markdown file goes into the engine, marked with a seal, and comes out as a slide. A dot travels the path from file to slide.\nduration: 0:25\nnotes: |\n  When a slide needs motion, it names a drawing module.\n  The module draws with a small context: lines, curves, icons, chips and seals.\n  Every mark prints itself once, when the slide arrives.\n  The same drawing gets a landscape and a portrait layout.\n  And a module can keep playing, like the dot moving along this path.\nsources:\n  - \"README.md, Animated slides\"\n  - \"engine/draw.js\"\n---\n`draw: animations/pipeline.js` in the front matter\n"},{"file":"decks/example/slides/05-edit.md","raw":"---\ntitle: Edit and comment from the page\nstatus: now\nduration: 0:28\nnotes: |\n  Press E and the deck opens its editor beside the slide.\n  Change the Markdown and the slide redraws as you type.\n  Select any text, on the slide or in the source, and leave a comment.\n  Editing signs in with your own GitHub token.\n  An edit becomes a commit on a branch, with a pull request.\n  A comment lands on that pull request, on the line you selected.\nsources:\n  - \"README.md, Editing and comments\"\n  - \"engine/github.js\"\n---\n1. Press \u003ckbd>E\u003c/kbd> to open the editor\n2. Edit the Markdown, the script or the sources; the slide redraws as you type\n3. Select text to comment on it\n4. Save: a commit on a branch, and a pull request\n5. Comments become review comments on that pull request\n"},{"file":"decks/example/slides/06-record.md","raw":"---\ntitle: Record a three-minute take\nstatus: now\nduration: 0:15\nnotes: |\n  Press R to record a take.\n  The slides and your microphone, no camera.\n  This script, a timer and the next slide stay on your side of the screen.\n  The video downloads to your computer.\nsources:\n  - \"README.md, Recording a session\"\n  - \"engine/recorder.js\"\n---\n- Slides and microphone, no camera\n- 1920 × 1080, MP4 where the browser supports it, otherwise WebM\n- Script, timer and next slide visible to the presenter only\n- Saved to your computer, never uploaded\n"},{"file":"decks/example/slides/07-planned.md","raw":"---\ntitle: Marks for planned work\nstatus: next\nlayout: center\nduration: 0:10\nnotes: |\n  One last mark.\n  A slide with status next gets dashed lines and printer's marks,\n  for work that is planned rather than done.\nsources:\n  - \"README.md, The Markdown slide format\"\n---\n`status: next` draws dashed marks and printer's proof marks around a slide about work that is planned.\n"}],"comments":[],"repo":{"owner":"bitswell-hq","name":"seal-slides","ref":"main","sha":"88a35bfb68abafec5c2b3ebdace2e1fae5629a0d"},"built":"2026-11-10T02:06:38.526Z"}</script>
